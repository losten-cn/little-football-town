# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: resource_format_saves
    status: active
    api: Godot Resource (.tres) via ResourceSaver.save() and ResourceLoader.load()
    not: JSON (.json), ConfigFile (.cfg), SQLite   # explicitly rejected in ADR-0003
    adr: docs/architecture/adr-0003-save-load-persistence.md
    reason: ".tres provides type-safe @export var serialization, Editor visibility for debugging, and native nested Resource handling. JSON requires manual type coercion; ConfigFile lacks nested support; SQLite adds native dependency for no benefit in single-player snapshot saves."
    referenced_by:
      - docs/architecture/adr-0003-save-load-persistence.md
    added: 2026-05-16

  - purpose: custom_resource_config
    status: active
    api: Godot Custom Resources (.tres) via class_name extends Resource with @export var and validate()
    not: JSON (.json), ConfigFile (.cfg), inline GDScript const   # explicitly rejected in ADR-0004
    adr: docs/architecture/adr-0004-data-driven-configuration.md
    reason: "Custom Resources provide type-safe @export var fields, Editor Inspector editing for designers, native ResourceLoader for fast binary deserialization, and self-validating validate() methods. JSON lacks type safety and Editor integration. ConfigFile has no nested support and is string-keyed. Inline const violates the hardcoded-values forbidden pattern."
    referenced_by:
      - docs/architecture/adr-0004-data-driven-configuration.md
    added: 2026-05-16

  - purpose: player_refcounted_not_resource
    status: active
    api: RefCounted (class_name Player extends RefCounted) with manual to_dict()/from_dict() serialization
    not: Player extends Resource, Dictionary-based player   # explicitly rejected in ADR-0005
    adr: docs/architecture/adr-0005-player-data-model.md
    reason: "RefCounted is lighter than Resource per instance. 100 players as Resources = ~10KB wasted + file-per-instance expectation. Manual to_dict()/from_dict() gives explicit control over serialization boundary — only authoritative fields are saved, derived fields (effective) are recomputed on load."
    referenced_by:
      - docs/architecture/adr-0005-player-data-model.md
    added: 2026-05-16

  - purpose: facility_refcounted_not_resource
    status: active
    api: RefCounted (class_name Facility extends RefCounted) with manual to_dict()/from_dict() serialization
    not: Facility extends Resource, Dictionary-based facility   # explicitly rejected in ADR-0008
    adr: docs/architecture/adr-0008-town-grid-facility-system.md
    reason: "RefCounted is lighter than Resource per instance (max 25 facilities). Manual to_dict()/from_dict() is consistent with Player model (ADR-0005). Grid stores object references — Resources would add file-path tracking overhead for in-memory-only objects."
    referenced_by:
      - docs/architecture/adr-0008-town-grid-facility-system.md
    added: 2026-05-17

  - purpose: league_refcounted_not_resource
    status: active
    api: RefCounted (class_name LeagueSeason, StandingsEntry, ScheduledMatch extends RefCounted) with manual to_dict()/from_dict() serialization
    not: LeagueSeason extends Resource, Dictionary-based season state   # explicitly rejected in ADR-0009
    adr: docs/architecture/adr-0009-league-competition-structure.md
    reason: "RefCounted is consistent with Player (ADR-0005), Facility (ADR-0008), and Transaction (ADR-0007). Season state is runtime data that changes every match — Resource file-path tracking is unnecessary overhead for 38 matches × ~150 bytes = ~6KB of data."
    referenced_by:
      - docs/architecture/adr-0009-league-competition-structure.md
    added: 2026-05-17

  - purpose: random_event_settlement_key_identity
    status: active
    api: "RandomEventManager.build_event_settlement_key(event_instance_id, selected_option_id, target_scope, target_id) -> String"
    not: "Including rule_version or other evaluation metadata in the durable key source"
    adr: docs/architecture/adr-0012-random-event-settlement-contracts.md
    reason: "Random Event durable settlement identity must remain stable across metadata revisions, reloads, and migration paths. rule_version is evaluation/history metadata only and must not create a new durable event identity."
    referenced_by:
      - docs/architecture/adr-0012-random-event-settlement-contracts.md
    added: 2026-06-28

  - purpose: random_event_evaluation_metadata_boundary
    status: active
    api: "RandomEventManager.build_random_event_evaluation_metadata(event_id, rule_version, trigger_window) -> Dictionary[String, Variant]"
    not: "Encoding version-sensitive evaluation or compatibility decisions by generating a new durable settlement identity"
    adr: docs/architecture/adr-0012-random-event-settlement-contracts.md
    reason: "Version-sensitive behavior belongs in evaluation/history/migration metadata, not in event_settlement_key. This preserves idempotency while still allowing compatibility checks and audit trails."
    referenced_by:
      - docs/architecture/adr-0012-random-event-settlement-contracts.md
    added: 2026-06-28

