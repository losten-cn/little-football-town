# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: direct_cross_system_signal_connection
    status: active
    description: "Systems must not connect signals directly to other system nodes. All cross-system communication must route through EventBus.emit() / EventBus.subscribe()."
    why: "Direct signal connections create tight coupling between producer and consumer nodes. This violates the Core↔UI ownership boundary (ADR-0001) and prevents save/load from capturing communication state."
    adr: docs/architecture/adr-0002-event-signal-architecture.md
    added: 2026-05-16

  - pattern: direct_file_access_by_core_systems
    status: active
    description: "Core systems must not call FileAccess, ResourceSaver, or ResourceLoader directly. Only SaveManager touches disk. Core systems provide serialize()/deserialize() Callables via SaveManager.register_system()."
    why: "Direct file access by Core systems creates multiple persistence paths, breaking the unified save/load boundary. SaveManager's ordered deserialization, version migration, and integrity checking cannot function if systems bypass it."
    adr: docs/architecture/adr-0003-save-load-persistence.md
    added: 2026-05-16

  - pattern: hardcoded_tuning_values
    status: active
    description: "Game tuning values (formula parameters, resource caps, phase durations, training costs, etc.) must not be hardcoded as GDScript const in src/. All tuning values must live in res://config/*.tres Custom Resource files and be read via ConfigLoader typed properties."
    why: "Hardcoded values require recompilation to change, prevent designer tuning without code access, and scatter related parameters across files. Data-driven config enables Editor Inspector editing, centralizes all tuning knobs, and enables unit tests that load specific config values in isolation."
    adr: docs/architecture/adr-0004-data-driven-configuration.md
    added: 2026-05-16

  - pattern: direct_player_attribute_write
    status: active
    description: "External systems must not directly assign to Player.Attributes fields (e.g., player.attributes.spd.current += 5). All attribute changes must go through PlayerDevelopment.train() or a formally declared interface. MatchSimulation may READ attributes but must never write them."
    why: "Direct attribute writes from multiple systems create untraceable state changes, break the serialization boundary, and violate the single-writer-per-state ownership model established in ADR-0001."
    adr: docs/architecture/adr-0005-player-data-model.md
    added: 2026-05-16

  - pattern: direct_match_outcome_override
    status: active
    description: "External systems must not directly set MatchResultPacket.result, home_score, or away_score. All match outcomes are determined exclusively by MatchSimulation's event generation pipeline. LeagueStructure and EconomyManager consume the result packet as read-only."
    why: "Direct outcome overrides would invalidate the match simulation's event generation, player performance tracking, and win reason analysis. It would create untraceable result manipulation and break the '看懂为什么输赢' design goal."
    adr: docs/architecture/adr-0006-match-simulation-architecture.md
    added: 2026-05-16

  - pattern: direct_resource_balance_mutation
    status: active
    description: "External systems must not directly assign to EconomyManager.funds, .action_points, or .research_points. All resource mutations must go through execute_transaction() or typed accredit_* entry points (accredit_facility_cost, accredit_training_cost, accredit_match_reward)."
    why: "Direct balance writes bypass validation (floor enforcement, debt ceiling), break the audit trail (no Transaction log entry), and violate the GDD Core Rule that EconomyManager is the sole authorizer of resource changes."
    adr: docs/architecture/adr-0007-economy-transaction-framework.md
    added: 2026-05-17

  - pattern: direct_facility_state_write
    status: active
    description: "External systems must not directly assign to Facility fields (level, state, grid_x, grid_y, remaining_construction_units). All facility mutations must go through TownBuilding.build_facility(), .upgrade_facility(), or .demolish_facility(). External systems read facility bonuses via compute_*() methods only."
    why: "Direct facility writes bypass state machine validation (e.g., upgrading an already-upgrading facility), break adjacency recomputation triggers, and violate the single-writer-per-state ownership model."
    adr: docs/architecture/adr-0008-town-grid-facility-system.md
    added: 2026-05-17

  - pattern: direct_standings_write
    status: active
    description: "External systems must not directly assign to StandingsEntry fields (points, wins, draws, goals_for, etc.) or modify the season schedule. All standings updates go through LeagueStructure._on_match_completed() which consumes MatchResultPacket from EventBus."
    why: "Direct standings writes bypass the match_id deduplication check, break the single-writer-per-state ownership model, and would create untraceable ranking manipulation. Standings are a deterministic projection of match results — bypassing the match→standings pipeline breaks auditability."
    adr: docs/architecture/adr-0009-league-competition-structure.md
    added: 2026-05-17

  - pattern: local_reputation_truth_recomputation
    status: active
    description: "UI and external systems must not locally recompute reputation progress, achievement completion, reward claimability, or recognition settlement truth. They must consume authoritative payloads from ReputationAchievementManager only."
    why: "Local recomputation would reintroduce drift between UI, save/load, and durable settlement state, especially under Godot 4.6 dual-focus UI behavior and reload paths. The accepted architecture requires a single writer and read-only consumers for long-term recognition truth."
    adr: docs/architecture/adr-0011-reputation-and-achievement-recognition-framework.md
    added: 2026-06-03

  - pattern: rule_version_in_reputation_settlement_key
    status: active
    description: "Stable reputation settlement keys must not include rule_version. The key source is limited to deterministic scalar identity such as settlement_id, reward_scope, and reward_id; rule_version is metadata only."
    why: "Including rule_version in the stable key source would break idempotency across migrations and metadata revisions, causing duplicate reward delivery or divergent durable state. ADR-0011 aligns this rule with ADR-0010's stable settlement-key contract."
    adr: docs/architecture/adr-0011-reputation-and-achievement-recognition-framework.md
    added: 2026-06-03

  - pattern: rule_version_in_random_event_settlement_key
    status: active
    description: "Stable random-event settlement keys must not include rule_version. The durable key source is limited to deterministic identity fields such as event_instance_id, selected_option_id, target_scope, and target_id; rule_version is metadata only."
    why: "Including rule_version in the durable random-event key source would make the same historical event result appear new after metadata or migration changes, breaking idempotency across save/load recovery and confirmed-fact routing into downstream systems such as ReputationAchievementManager."
    adr: docs/architecture/adr-0012-random-event-settlement-contracts.md
    added: 2026-06-28

  - pattern: version_compatibility_via_new_durable_identity
    status: active
    description: "Systems must not resolve version-sensitive evaluation or compatibility changes by generating a new durable settlement identity for the same historical fact. Version differences belong in evaluation/history/migration metadata."
    why: "Changing durable identity to represent metadata drift breaks replay safety, reload idempotency, and cross-system settlement consistency. Accepted ADRs require durable identity to remain stable while evaluation compatibility is handled in metadata-aware logic."
    adr: docs/architecture/adr-0012-random-event-settlement-contracts.md
    added: 2026-06-28

  - pattern: direct_random_event_target_mutation
    status: active
    description: "RandomEventManager must not directly mutate resource balances, player attributes/state, facility state, match truth, time progression, or long-term recognition truth. Random event outcomes must be submitted as confirmed facts or effect requests to the authoritative target system."
    why: "Direct target mutation would break the single-writer ownership model established across EconomyManager, PlayerDevelopment, TownBuilding, MatchCompetition, TimeManager, and ReputationAchievementManager. It would also make save/load recovery and idempotent event settlement unreliable."
    adr: docs/architecture/adr-0012-random-event-settlement-contracts.md
    added: 2026-06-28

  - pattern: random_event_ui_truth_recomputation
    status: active
    description: "UI must not redraw random event pools, recompute event eligibility, infer processed state from hover/focus/local cache, or generate event results locally. UI consumes RandomEventManager authoritative payloads only."
    why: "Local UI recomputation would create a second source of truth for pending events and processed results, especially across Godot 4.6 focus behavior changes and save/load restoration paths. Random event truth must remain owned by RandomEventManager."
    adr: docs/architecture/adr-0012-random-event-settlement-contracts.md
    added: 2026-06-28

  - pattern: transient_ui_focus_as_audio_truth
    status: active
    description: "Audio playback logic must not treat raw Control focus, hover, or other transient local UI heuristics as stable semantic audio truth. AudioManager consumes normalized UI playback anchors and stable EventBus events only."
    why: "Godot 4.6 dual-focus behavior can make raw focus churn differ by input method and UI state. Using transient UI focus as audio truth would create inconsistent playback semantics and a second inferred source of gameplay/presentation meaning."
    adr: docs/architecture/adr-0013-audio-settings-event-consumption.md
    added: 2026-06-28

  - pattern: transient_mix_overwrites_durable_audio_preferences
    status: active
    description: "Temporary fades, ducking, or crossfades must not overwrite the durable player preference truth for audio_master_volume, audio_bgm_volume, audio_sfx_volume, audio_ambience_volume, or audio_muted_categories. Persistent preferences and transient runtime mixing must remain separate control layers."
    why: "If transient runtime mixing writes into the same durable control surface as player preferences, BGM transitions or stinger ducking can corrupt saved settings truth, causing inconsistent restore behavior and ownership drift between runtime playback state and persistent audio settings."
    adr: docs/architecture/adr-0013-audio-settings-event-consumption.md
    added: 2026-06-28

