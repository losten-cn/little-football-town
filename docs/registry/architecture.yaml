    signal_signature: "execute_transaction(tx: Transaction) → Dictionary {success: bool, tx_id: int}. All resource mutations route through this single entry point. External systems use typed accredit_* methods. Because EconomyManager is scene-instantiated rather than a Foundation Autoload, callers must use an injected stable authority reference supplied by gameplay root or a scene-owned service container/runtime registry."
    referenced_by:
      - docs/architecture/adr-0007-economy-transaction-framework.md
    added: 2026-05-17

