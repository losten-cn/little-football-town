      - EconomyManager
      - TimeManager
      - MatchPerfUI
    adr: docs/architecture/adr-0006-match-simulation-architecture.md
    signal_signature: "MatchResultPacket.to_dict() → Dictionary: {home_score, away_score, result, events, player_performances, condition_changes, morale_changes, win_reasons, match_stats, post_match_tags}. Delivered via EventBus match_completed signal. If a direct-call reader accesses MatchCompetition-owned packet/query surfaces, it must do so through an injected stable authority reference rather than implicit global class access."
    referenced_by:
      - docs/architecture/adr-0006-match-simulation-architecture.md
    added: 2026-05-16

  - contract: economy_transaction_execution
