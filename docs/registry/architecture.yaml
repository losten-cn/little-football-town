    signal_signature: "via EventBus: league_standings_updated(season_number, standings: Array[StandingsEntry]), league_season_completed(season_number, tier, player_rank, points, promoted: bool, relegated: bool, next_tier, summary: Dictionary), league_season_started(season_number, tier, tier_name, team_count)"
    referenced_by:
      - docs/architecture/ADR-0009-league-competition-structure.md
    added: 2026-05-17

