# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: event_bus_routing
    status: active
    pattern: event_bus
    producer: EventBus
    consumers:
      - TimeManager
      - SaveManager
      - PlayerDevelopment
      - MatchCompetition
      - EconomyManager
      - TownBuilding
      - LeagueStructure
      - MainLoopUI
      - PlayerMgmtUI
      - MatchPerfUI
      - Onboarding
    adr: docs/architecture/adr-0002-event-signal-architecture.md
    signal_signature: "EventBus.emit(event_name: String, payload: Dictionary) — registered cross-system notifications and asynchronous events route through EventBus; accepted direct_call entries below remain valid only as explicit authority command/query contracts"
    referenced_by:
      - docs/architecture/adr-0002-event-signal-architecture.md
      - docs/architecture/adr-0001-scene-management.md
    added: 2026-05-16

  - contract: time_node_scheduling
    status: active
    pattern: event_bus
    producer: TimeManager
    consumers:
      - MatchCompetition (time_match_triggered)
      - EconomyManager (time_stage_settled, time_season_ended)
      - LeagueStructure (time_season_ended)
      - TownBuilding (time_stage_settled)
      - SaveManager (time_phase_changed)
    adr: docs/architecture/adr-0002-event-signal-architecture.md
    signal_signature: "via EventBus: time_phase_changed, time_match_triggered, time_stage_settled, time_season_ended"
    referenced_by:
      - docs/architecture/adr-0002-event-signal-architecture.md
    added: 2026-05-16

  - contract: save_system_registration
    status: active
    pattern: event_bus
    producer: SaveManager
    consumers:
      - TimeManager
      - PlayerDevelopment
      - MatchCompetition
      - EconomyManager
      - TownBuilding
      - LeagueStructure
      - AudioManager
    adr: docs/architecture/adr-0003-save-load-persistence.md
    signal_signature: "SaveManager.register_system(system_id: String, serialize_fn: Callable, deserialize_fn: Callable, slot: String = \"extension\", extension_key: String = \"\") — canonical Core systems restore through fixed snapshot fields; non-Core durable runtime authorities such as AudioManager restore through registered durable-state extensions like `audio_state`."
    referenced_by:
      - docs/architecture/adr-0003-save-load-persistence.md
      - docs/architecture/adr-0013-audio-settings-event-consumption.md
    added: 2026-05-16

  - contract: config_loader_access
    status: active
    pattern: direct_call
    producer: ConfigLoader
    consumers:
      - TimeManager
      - SaveManager
      - PlayerDevelopment
      - MatchCompetition
      - EconomyManager
      - TownBuilding
      - LeagueStructure
      - BalanceSystem
    adr: docs/architecture/adr-0004-data-driven-configuration.md
    signal_signature: "ConfigLoader exposes typed properties (e.g., ConfigLoader.balance_config: BalanceConfig). Core systems read config in _ready() via direct property access. No string-keyed lookups. As a Foundation Autoload, ConfigLoader is a stable direct-call authority and does not require scene-level injection."
    referenced_by:
      - docs/architecture/adr-0004-data-driven-configuration.md
    added: 2026-05-16

  - contract: player_roster_access
    status: active
    pattern: direct_call
    producer: PlayerDevelopment
    consumers:
      - MatchCompetition
      - PlayerMgmtUI
      - MatchPerfUI
      - EconomyManager
      - TownBuilding
      - Onboarding
    adr: docs/architecture/adr-0005-player-data-model.md
    signal_signature: "PlayerDevelopment.roster.get_player(id) → Player, roster.query_by_tier(tier) → Array[Player], roster.query_by_position(pos) → Array[Player]. Player field access via typed properties. Because PlayerDevelopment is scene-instantiated rather than a Foundation Autoload, callers must receive a stable authority reference through gameplay-root injection or a scene-owned service container/runtime registry."
    referenced_by:
      - docs/architecture/adr-0005-player-data-model.md
    added: 2026-05-16

  - contract: match_result_packet
    status: active
    pattern: direct_call
    producer: MatchCompetition
    consumers:
