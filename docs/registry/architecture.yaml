    signal_signature: "execute_transaction(tx: Transaction) → Dictionary {success: bool, tx_id: int}. All resource mutations route through this single entry point. External systems use typed accredit_* methods."
    referenced_by:
      - docs/architecture/ADR-0007-economy-transaction-framework.md
