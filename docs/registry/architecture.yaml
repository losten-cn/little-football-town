# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: direct_cross_system_signal_connection
    status: active
    description: "Systems must not connect signals directly to other system nodes. All cross-system communication must route through EventBus.emit() / EventBus.subscribe()."
    why: "Direct signal connections create tight coupling between producer and consumer nodes. This violates the Core↔UI ownership boundary (ADR-0001) and prevents save/load from capturing communication state."
    adr: docs/architecture/ADR-0002-event-signal-architecture.md
    added: 2026-05-16

  - pattern: direct_file_access_by_core_systems
    status: active
    description: "Core systems must not call FileAccess, ResourceSaver, or ResourceLoader directly. Only SaveManager touches disk. Core systems provide serialize()/deserialize() Callables via SaveManager.register_system()."
    why: "Direct file access by Core systems creates multiple persistence paths, breaking the unified save/load boundary. SaveManager's ordered deserialization, version migration, and integrity checking cannot function if systems bypass it."
    adr: docs/architecture/ADR-0003-save-load-persistence.md
    added: 2026-05-16

  - pattern: hardcoded_tuning_values
    status: active
    description: "Game tuning values (formula parameters, resource caps, phase durations, training costs, etc.) must not be hardcoded as GDScript const in src/. All tuning values must live in res://config/*.tres Custom Resource files and be read via ConfigLoader typed properties."
    why: "Hardcoded values require recompilation to change, prevent designer tuning without code access, and scatter related parameters across files. Data-driven config enables Editor Inspector editing, centralizes all tuning knobs, and enables unit tests that load specific config values in isolation."
    adr: docs/architecture/ADR-0004-data-driven-configuration.md
    added: 2026-05-16

  - pattern: direct_player_attribute_write
    status: active
    description: "External systems must not directly assign to Player.Attributes fields (e.g., player.attributes.spd.current += 5). All attribute changes must go through PlayerDevelopment.train() or a formally declared interface. MatchSimulation may READ attributes but must never write them."
    why: "Direct attribute writes from multiple systems create untraceable state changes, break the serialization boundary, and violate the single-writer-per-state ownership model established in ADR-0001."
    adr: docs/architecture/ADR-0005-player-data-model.md
    added: 2026-05-16

  - pattern: direct_match_outcome_override
    status: active
    description: "External systems must not directly set MatchResultPacket.result, home_score, or away_score. All match outcomes are determined exclusively by MatchSimulation's event generation pipeline. LeagueStructure and EconomyManager consume the result packet as read-only."
    why: "Direct outcome overrides would invalidate the match simulation's event generation, player performance tracking, and win reason analysis. It would create untraceable result manipulation and break the '看懂为什么输赢' design goal."
    adr: docs/architecture/ADR-0006-match-simulation-architecture.md
    added: 2026-05-16

  - pattern: direct_resource_balance_mutation
    status: active
    description: "External systems must not directly assign to EconomyManager.funds, .action_points, or .research_points. All resource mutations must go through execute_transaction() or typed accredit_* entry points (accredit_facility_cost, accredit_training_cost, accredit_match_reward)."
    why: "Direct balance writes bypass validation (floor enforcement, debt ceiling), break the audit trail (no Transaction log entry), and violate the GDD Core Rule that EconomyManager is the sole authorizer of resource changes."
    adr: docs/architecture/ADR-0007-economy-transaction-framework.md
    added: 2026-05-17

  - pattern: direct_facility_state_write
    status: active
    description: "External systems must not directly assign to Facility fields (level, state, grid_x, grid_y, remaining_construction_units). All facility mutations must go through TownBuilding.build_facility(), .upgrade_facility(), or .demolish_facility(). External systems read facility bonuses via compute_*() methods only."
    why: "Direct facility writes bypass state machine validation (e.g., upgrading an already-upgrading facility), break adjacency recomputation triggers, and violate the single-writer-per-state ownership model."
    adr: docs/architecture/ADR-0008-town-grid-facility-system.md
    added: 2026-05-17

  - pattern: direct_standings_write
    status: active
    description: "External systems must not directly assign to StandingsEntry fields (points, wins, draws, goals_for, etc.) or modify the season schedule. All standings updates go through LeagueStructure._on_match_completed() which consumes MatchResultPacket from EventBus."
    why: "Direct standings writes bypass the match_id deduplication check, break the single-writer-per-state ownership model, and would create untraceable ranking manipulation. Standings are a deterministic projection of match results — bypassing the match→standings pipeline breaks auditability."
    adr: docs/architecture/ADR-0009-league-competition-structure.md
    added: 2026-05-17

