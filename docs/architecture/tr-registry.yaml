    system: tutorial-and-hint
    gdd: design/gdd/tutorial-and-hint-system.md
    requirement: "Core feedback from match, training, town, economy, reputation, achievement, or random event flows must take priority over automatic hints; hints must defer, suppress, or display non-focus UI only."
