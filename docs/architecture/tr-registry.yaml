    status: active

  - id: TR-tutorial-004
    system: tutorial-and-hint
    gdd: design/gdd/tutorial-and-hint-system.md
    requirement: "seen_hint_records, hint_cooldown_state, user hint preferences, and help index unlock state must persist across save/load without repeated hint spam."
