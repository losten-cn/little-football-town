  - id: TR-tutorial-005
    system: tutorial-and-hint
    gdd: design/gdd/tutorial-and-hint-system.md
    requirement: "hint_record_key = stable_digest(canonical_join([hint_id, anchor_id, payload_source_id, hint_version], \"|\")) and duplicate key submission must be idempotent no-op."
